name: 播客转写

# 与采集分开跑：采集只负责把没有现成文字稿的播客入队，这里把队列消化掉。
#
# 后端用 OpenRouter 而不是 Workers AI：免费层每天只有 214 音频分钟，
# 且实测不按 00:00 UTC 重置，队列长期积压。OpenRouter 按量付费，
# whisper-1 $0.006/音频分钟，跑在 Actions 上跟本机开不开机无关。
# 选型依据见 etl/src/whisper-openrouter.ts 顶部的实测表。
on:
  schedule:
    # 每 6 小时一次，与 ETL 的整点错开
    - cron: '30 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: '本次运行的音频分钟上限（90 分钟约 $0.54）'
        required: false
        default: '90'

concurrency:
  group: transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: etl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: etl/package-lock.json

      - name: 安装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install deps
        run: npm ci

      - name: 转写
        env:
          CF_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'news-pwa' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRANSCRIBE_BACKEND: openrouter
          # 花钱的后端唯一的刹车：一天四次 cron，最多 4 × 90 分钟 ≈ $2.2
          TRANSCRIBE_MINUTES: ${{ github.event.inputs.minutes || '90' }}
        run: npm run transcribe

      - name: Summary
        if: always()
        run: echo "转写运行结束：$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"

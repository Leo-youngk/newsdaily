name: 播客转写

# 与采集分开跑：采集只负责把没有现成文字稿的播客入队，
# 这里按 Workers AI 的免费额度把队列消化掉。
on:
  schedule:
    # 每 6 小时一次，与 ETL 的整点错开
    - cron: '30 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: '本次转写的音频分钟额度（免费层每天约 214 分钟）'
        required: false
        default: '180'

concurrency:
  group: transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: etl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: etl/package-lock.json

      - name: 安装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install deps
        run: npm ci

      - name: 转写
        env:
          CF_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'news-pwa' }}
          TRANSCRIBE_MINUTES: ${{ github.event.inputs.minutes || '180' }}
        run: npm run transcribe

      - name: Summary
        if: always()
        run: echo "转写运行结束：$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"

name: ETL 采集

on:
  schedule:
    # 每 2 小时一次（UTC）
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      only_sources:
        description: '仅运行指定源 id（逗号分隔，留空为全部）'
        required: false
        default: ''
      dry_run:
        description: '试运行（不写 R2）'
        required: false
        default: '0'

# 同一时间只跑一个，避免并发写冲突
concurrency:
  group: etl-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: etl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: etl/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run ETL
        env:
          CF_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'news-pwa' }}
          ONLY_SOURCES: ${{ github.event.inputs.only_sources }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          IMG_BASE: '/data/'
        run: npm start

      - name: Summary
        if: always()
        run: echo "ETL 运行结束：$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"
